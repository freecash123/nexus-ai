<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Nexus AI</title>
<meta name="description" content="Nexus AI - A powerful, free AI assistant for everyone."/>
<meta property="og:title" content="Nexus AI"/>
<meta property="og:description" content="A powerful, free AI assistant for everyone."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--surface:#1E1E1E;--surface2:#2A2A2A;--surface3:#333;--border:#2E2E2E;--text:#ECECF1;--text2:#B4B4BB;--text3:#6E6E7A;--accent:#7C6FF7;--accent2:#9B8FF7;--green:#19C37D;--red:#EF4444;--amber:#F59E0B;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
#sidebar{width:260px;flex-shrink:0;background:var(--surface);display:flex;flex-direction:column;border-right:1px solid var(--border);transition:width 0.25s}
#sidebar.collapsed{width:0;overflow:hidden}
.sidebar-top{padding:12px;display:flex;align-items:center;justify-content:space-between}
#newChatBtn{flex:1;padding:10px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:all 0.2s;display:flex;align-items:center;gap:8px}
#newChatBtn:hover{background:var(--surface2)}
#chatList{flex:1;overflow-y:auto;padding:4px 8px}
.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:all 0.15s}
.chat-item:hover{background:var(--surface2);color:var(--text)}
.chat-item.active{background:var(--surface2);color:var(--text)}
.chat-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chat-item.active .dot{background:var(--accent)}
.chat-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del{opacity:0;font-size:15px;padding:2px 5px;border-radius:4px;transition:all 0.15s}
.chat-item:hover .del{opacity:1}.chat-item .del:hover{color:var(--red);background:rgba(239,68,68,0.15)}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg)}
#topbar .left{display:flex;align-items:center;gap:10px}
.hamburger{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.hamburger:hover{background:var(--surface2);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 12px;border-radius:99px;font-weight:600;background:rgba(25,195,125,0.1);color:var(--green)}
.badge .dot2{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.btn-icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:16px;transition:all 0.2s}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
/* CHAT */
#chatArea{flex:1;overflow-y:auto;padding:20px 0}
.chat-container{max-width:740px;margin:0 auto;padding:0 24px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;gap:16px;min-height:300px}
.welcome .logo{width:60px;height:60px;background:var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative}
.welcome .logo::after{content:'';position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--bg);animation:pulse 2s infinite}
.welcome h1{font-size:28px;font-weight:800}.welcome h1 span{color:var(--accent)}
.welcome p{color:var(--text2);font-size:14px;max-width:500px;line-height:1.6}
.quick-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.qp{padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:99px;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.2s}
.qp:hover{border-color:var(--accent);color:var(--text)}
/* MESSAGES */
.msg{display:flex;gap:12px;padding:18px 0;animation:fadeIn 0.3s}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg .avatar{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
.msg.user .avatar{background:var(--amber);color:#000}
.msg.ai .avatar{background:var(--accent);color:#fff}
.msg-body{flex:1;min-width:0}
.msg-body .label{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
.msg-body .content{font-size:14px;line-height:1.7;word-wrap:break-word}
.msg-body .content p{margin-bottom:8px}.msg-body .content p:last-child{margin-bottom:0}
.msg-body .content code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:12px;font-family:monospace}
.msg-body .content pre{background:#000;border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;font-size:12px;font-family:monospace;line-height:1.5;margin:8px 0}
.msg-body .content ul,.msg-body .content ol{margin:6px 0;padding-left:20px}.msg-body .content li{margin-bottom:4px}
.msg-body .content img.msg-img{max-width:240px;max-height:180px;border-radius:8px;margin-bottom:6px;display:block;cursor:pointer}
/* THINKING */
.think{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:11px;color:var(--text2)}
.think .think-head{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--accent);font-size:10px;text-transform:uppercase;margin-bottom:4px}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* INPUT */
#inputArea{flex-shrink:0;padding:12px 0 16px;background:var(--bg)}
.input-container{max-width:740px;margin:0 auto;padding:0 24px}
.mm-bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mm-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:15px;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.mm-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--text)}
.mm-btn.recording{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.5s infinite}
.mm-btn.camera-on{background:var(--green);border-color:var(--green);color:#000}
.mm-btn.speaking{background:var(--accent);border-color:var(--accent);color:#fff}
.mm-btn.live-active{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
#voiceHint{font-size:12px;color:var(--accent);text-align:center;margin-bottom:6px;display:none}
#imagePreview{display:none;margin-bottom:6px}#imagePreview .iwrap{position:relative;display:inline-block}
#imagePreview img{max-width:140px;max-height:90px;border-radius:8px;border:1px solid var(--border);object-fit:cover}
#imagePreview .rm-btn{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
#cameraView{display:none;margin-bottom:8px}#cameraView video{width:100%;max-height:160px;border-radius:8px;border:1px solid var(--border);background:#000}
#cameraView .cam-row{display:flex;gap:6px;justify-content:center;margin-top:6px}
.cam-btn{padding:5px 14px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:none}.cam-cap{background:var(--accent);color:#fff}.cam-cap:hover{opacity:0.9}.cam-close{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.input-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;display:flex;align-items:flex-end;gap:8px;padding:8px 12px;transition:all 0.2s}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,111,247,0.15)}
#userInput{flex:1;background:none;border:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;padding:4px 0;min-height:22px;max-height:150px;line-height:1.5}
#userInput::placeholder{color:var(--text3)}
#sendBtn{width:32px;height:32px;border-radius:8px;background:var(--surface3);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;opacity:0.3}
#sendBtn.active{opacity:1;background:var(--accent)}#sendBtn.active:hover{opacity:0.85}
#sendBtn:disabled{opacity:0.25;cursor:not-allowed}
.footer{text-align:center;margin-top:6px;font-size:10px;color:var(--text3)}
/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:90%;max-width:420px}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:12px}
.modal-box label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em}
.modal-box input,.modal-box select{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:10px}
.modal-box input:focus,.modal-box select:focus{border-color:var(--accent)}
.modal-box .hint{font-size:10px;color:var(--text3);margin-top:-6px;margin-bottom:10px}.modal-box .hint a{color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{padding:8px 16px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:none}.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{opacity:0.9}.btn-sec{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.btn-sec:hover{background:var(--surface3)}.btn-dan{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}.btn-dan:hover{background:rgba(239,68,68,0.15)}
/* SIDEBAR OVERLAY MOBILE */
.sb-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:5}
@media(max-width:768px){#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:10;transform:translateX(0)}#sidebar.collapsed{transform:translateX(-100%);width:260px}.sb-overlay.active{display:block}.chat-container{padding:0 16px}.input-container{padding:0 16px}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}
</style>
</head>
<body>

<div id="app">
<div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
<div class="sidebar-top">
<button id="newChatBtn" onclick="newChat()">+ New chat</button>
</div>
<div id="chatList"></div>
</div>

<div id="main">
<div id="topbar">
<div class="left">
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<span id="statusBadge" class="badge"><span class="dot2"></span>Gemini AI</span>
</div>
<button class="btn-icon" onclick="openSettings()" title="Settings">⚙</button>
</div>

<div id="chatArea">
<div id="messages" class="chat-container"></div>
<div id="welcomeScreen" class="welcome">
<div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg></div>
<h1>Nexus <span>AI</span></h1>
<p>Your powerful, free AI assistant. Chat with images, use voice, or start a live camera session.</p>
<div class="quick-prompts">
<div class="qp" onclick="sendQuick('Explain quantum computing simply')">🧪 Quantum computing</div>
<div class="qp" onclick="sendQuick('Write a Python sort function')">💻 Code help</div>
<div class="qp" onclick="sendQuick('Plan a product launch in 30 days')">🚀 Product launch</div>
<div class="qp" onclick="sendQuick('Compare Python vs JavaScript')">📊 Compare languages</div>
</div>
</div>
</div>

<div id="inputArea">
<div class="input-container">
<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
<div class="mm-bar">
<button class="mm-btn" onclick="triggerImageUpload()" title="Upload image">🖼️</button>
<button class="mm-btn" id="voiceBtn" onclick="toggleVoiceConversation()" title="Voice conversation">🎤</button>
<button class="mm-btn" id="cameraBtn" onclick="toggleCamera()" title="Camera / Live">📷</button>
<button class="mm-btn" id="speakBtn" onclick="toggleSpeech()" title="Read aloud">🔊</button>
<button class="mm-btn" id="liveBtn" onclick="toggleLiveCamera()" title="Live camera with AI vision">🔴</button>
</div>
<div id="voiceHint"></div>
<div id="imagePreview"><div class="iwrap"><img id="previewImg" src=""><button class="rm-btn" onclick="clearImage()">×</button></div></div>
<div id="cameraView"><video id="camVideo" autoplay playsinline></video><div class="cam-row"><button class="cam-btn cam-cap" onclick="capturePhoto()">📸 Capture</button><button class="cam-btn cam-cap" id="liveCapBtn" onclick="captureLiveSend()" style="display:none">🔴 Live Send</button><button class="cam-btn cam-close" onclick="closeCamera()">✕ Close</button></div></div>
<div class="input-wrap">
<textarea id="userInput" placeholder="Message Nexus AI..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
<button id="sendBtn" onclick="sendMessage()" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></button>
</div>
<div class="footer">Free for everyone · No login required</div>
</div>
</div>
</div>
</div>

<div id="settingsModal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeSettings()">
<div class="modal-box">
<h3>⚙ Settings</h3>
<label>AI Provider</label>
<select id="apiProvider" onchange="document.getElementById('gemSet').style.display=this.value==='gemini'?'block':'none'">
<option value="simulation">Built-in AI (No setup)</option>
<option value="gemini">Google Gemini (Free key)</option>
</select>
<div id="gemSet" style="display:none">
<label>Gemini API Key</label>
<input type="password" id="apiKey" placeholder="AIza...">
<div class="hint"><a href="https://aistudio.google.com/apikey" target="_blank">Get free key →</a> 1500 req/day free</div>
</div>
<div class="modal-btns">
<button class="btn btn-dan" onclick="clearAllData()">🗑 Clear All</button>
<button class="btn btn-sec" onclick="closeSettings()">Cancel</button>
<button class="btn btn-pri" onclick="saveSettings()">Save</button>
</div>
</div>
</div>

<script src="nexus-app.js"></script>
</body>
</html>
